name: mechanix-clock
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Ojas <ojasc@ext.mechasystems.com>"
description: Mechanix Clock application
homepage: https://github.com/mecha-org/mechanix-clock.git
license: BSD

contents:
  - src: ./stage/bundle/mechanix_clock
    dst: /usr/share/mechanix/mechanix-clock/mechanix_clock
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib
    dst: /usr/share/mechanix/mechanix-clock/lib
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-clock/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_clock
    file_info:
      mode: 0755
  - src: ./org.mechanix.clock.desktop
    dst: /usr/share/applications/org.mechanix.clock.desktop
  - src: ./assets/mechanix_clock.png
    dst: /usr/share/icons/hicolor/48x48/apps/mechanix_clock.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
